<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pulse is a small social network: write short posts, comment, like and follow people.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Log in · Pulse</title>
</head>
<body data-page="login" class="center">
  <main class="auth-page">
    <div>
      <h1 class="mark">Pulse</h1>
      <p class="lead">Short posts from people you follow, and a place to write yours.</p>
    </div>
    <section class="auth" aria-label="Log in or sign up">
      <div class="tabs" role="tablist" aria-label="Account">
        <button type="button" role="tab" data-mode="login" aria-selected="true">Log in</button>
        <button type="button" role="tab" data-mode="register" aria-selected="false">Sign up</button>
      </div>
      <form id="auth">
        <label>Username <input name="username" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="100"></label>
        <p id="err" class="error" role="alert"></p>
        <button type="submit" class="btn btn--primary btn--wide">Log in</button>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
